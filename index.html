<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#f8cbd9">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Para vos ♡</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100svh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #472633;

            overflow-x: hidden;

            background:
                linear-gradient(
                    145deg,
                    #fff3f7 0%,
                    #fbdce6 45%,
                    #f3c2d2 100%
                );
        }


        /* =========================================================
           FONDO
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        /* Luces */

        .glow {
            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(70px);

            opacity: .32;

            animation:
                glowMove 10s ease-in-out infinite alternate;
        }

        .glow-1 {
            top: -130px;
            left: -100px;

            background: #ffffff;
        }

        .glow-2 {
            right: -130px;
            top: 30%;

            background: #ff9fbd;

            animation-delay: 2s;
        }

        .glow-3 {
            bottom: -150px;
            left: 20%;

            background: #ffffff;

            animation-delay: 4s;
        }

        @keyframes glowMove {

            0% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            100% {
                transform:
                    translate3d(40px, -30px, 0)
                    scale(1.18);
            }
        }


        /* =========================================================
           PARTÍCULAS
        ========================================================= */

        .sparkles {
            position: fixed;
            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 1;
        }

        .sparkle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: rgba(255,255,255,.75);

            animation:
                sparkleAnimation
                4s ease-in-out infinite;
        }

        @keyframes sparkleAnimation {

            0%,
            100% {
                opacity: 0;
                transform: scale(.5);
            }

            50% {
                opacity: .9;
                transform: scale(1.4);
            }
        }


        /* =========================================================
           CORAZONES FLOTANTES
        ========================================================= */

        #floatingHearts {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 2;
        }

        .floating-heart {
    position: absolute;

    bottom: -60px;

    color: rgba(255, 105, 145, 0.65);

    text-shadow:
        0 0 8px rgba(255, 120, 155, 0.35),
        0 0 18px rgba(255, 120, 155, 0.2);

    user-select: none;

    font-weight: 400;

    animation:
        floatHeart
        linear
        forwards;
}

@keyframes floatHeart {

    0% {
        opacity: 0;

        transform:
            translate3d(0, 0, 0)
            rotate(0deg)
            scale(.6);
    }

    8% {
        opacity: .75;
    }

    30% {
        transform:
            translate3d(
                var(--moveX),
                -30vh,
                0
            )
            rotate(var(--rotation))
            scale(1);
    }

    60% {
        opacity: .6;

        transform:
            translate3d(
                calc(var(--moveX) * -0.5),
                -65vh,
                0
            )
            rotate(calc(var(--rotation) * -1))
            scale(1.1);
    }

    85% {
        opacity: .4;
    }

    100% {
        opacity: 0;

        transform:
            translate3d(
                var(--moveX),
                -115vh,
                0
            )
            rotate(var(--rotation))
            scale(1.3);
    }
}


        /* =========================================================
           INTRO
        ========================================================= */

        #intro {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                max(25px, env(safe-area-inset-top))
                25px
                max(25px, env(safe-area-inset-bottom));

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(255,255,255,.85),
                    transparent 34%
                ),
                linear-gradient(
                    145deg,
                    #fff3f7,
                    #f6c9d8
                );

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }

        #intro.hidden {
            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }

        .intro-content {
            width: 100%;
            max-width: 390px;

            text-align: center;

            animation:
                introAppear 1.2s ease forwards;
        }

        .intro-heart {
            font-size: 58px;

            margin-bottom: 24px;

            filter:
                drop-shadow(
                    0 8px 15px
                    rgba(180,70,100,.15)
                );

            animation:
                heartBeat 1.8s
                ease-in-out
                infinite;
        }

        .intro-title {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(40px, 11vw, 55px);

            font-weight: 400;

            letter-spacing: -1.5px;

            color: #442430;

            margin-bottom: 15px;
        }

        .intro-text {
            font-size: 15px;

            line-height: 1.8;

            color:
                rgba(68,36,48,.62);

            margin-bottom: 34px;
        }

        .open-button {
            border: none;

            outline: none;

            padding:
                16px 40px;

            border-radius: 999px;

            background: #ffffff;

            color: #56303d;

            font-size: 15px;

            font-weight: 600;

            box-shadow:
                0 14px 35px
                rgba(110,45,70,.17);

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .open-button:active {
            transform: scale(.93);

            box-shadow:
                0 7px 18px
                rgba(110,45,70,.14);
        }

        @keyframes introAppear {

            from {
                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.13);
            }
        }


        /* =========================================================
           APP
        ========================================================= */

        .app {
            position: relative;

            z-index: 5;

            min-height: 100svh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                max(35px, env(safe-area-inset-top))
                20px
                max(35px, env(safe-area-inset-bottom));
        }

        .player {
            width: 100%;

            max-width: 390px;

            text-align: center;

            opacity: 0;

            transform:
                translateY(30px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }

        .player.visible {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* =========================================================
           ETIQUETA
        ========================================================= */

        .note {
            display: inline-block;

            padding:
                7px 14px;

            margin-bottom: 20px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.5);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            color: #795060;

            font-size: 11px;

            letter-spacing: .3px;

            animation:
                noteFloat 3s
                ease-in-out
                infinite;
        }

        @keyframes noteFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-4px);
            }
        }


        /* =========================================================
           PORTADA
        ========================================================= */

        .cover-container {
            position: relative;

            width: min(78vw, 320px);

            aspect-ratio: 1 / 1;

            margin:
                0 auto 28px;
        }

        .cover-container::before,
        .cover-container::after {
            content: "♡";

            position: absolute;

            color:
                rgba(255,255,255,.8);

            font-size: 25px;

            z-index: -1;

            animation:
                orbitHeart
                4s ease-in-out
                infinite;
        }

        .cover-container::before {
            top: -15px;
            left: -18px;
        }

        .cover-container::after {
            right: -15px;
            bottom: -12px;

            animation-delay:
                1.3s;
        }

        @keyframes orbitHeart {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-8deg);

                opacity: .5;
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(8deg);

                opacity: 1;
            }
        }

        .cover {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            border-radius: 26px;

            box-shadow:
                0 25px 65px
                rgba(105,40,65,.25);

            transition:
                transform .5s ease,
                box-shadow .5s ease;
        }

        .player.playing .cover {
            animation:
                coverPulse
                4s ease-in-out
                infinite;
        }

        @keyframes coverPulse {

            0%,
            100% {
                transform:
                    scale(1);

                box-shadow:
                    0 25px 65px
                    rgba(105,40,65,.25);
            }

            50% {
                transform:
                    scale(1.018);

                box-shadow:
                    0 30px 75px
                    rgba(105,40,65,.30);
            }
        }


        /* =========================================================
           TÍTULO
        ========================================================= */

        .song-title {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(27px, 7vw, 34px);

            font-weight: 400;

            color: #42222d;

            letter-spacing: -.5px;
        }

        .artist {
            margin-top: 6px;

            margin-bottom: 25px;

            color:
                rgba(66,34,45,.52);

            font-size: 14px;
        }


        /* =========================================================
           PROGRESO
        ========================================================= */

        .progress {
            width: 100%;

            height: 5px;

            appearance: none;
            -webkit-appearance: none;

            background:
                rgba(80,35,50,.15);

            border-radius: 999px;

            outline: none;

            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;

            width: 15px;
            height: 15px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 2px 8px
                rgba(70,25,45,.2);
        }

        .progress::-moz-range-thumb {
            width: 15px;
            height: 15px;

            border: none;

            border-radius: 50%;

            background: white;
        }

        .time {
            display: flex;

            justify-content: space-between;

            margin-top: 8px;

            color:
                rgba(66,34,45,.45);

            font-size: 11px;
        }


        /* =========================================================
           CONTROLES
        ========================================================= */

        .controls {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 20px;

            margin-top: 21px;
        }

        .control {
            width: 50px;
            height: 50px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,.48);

            color: #4a2733;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease;
        }

        .control:active {
            transform:
                scale(.88);
        }

        .play {
            width: 68px;
            height: 68px;

            background: #ffffff;

            color: #44232e;

            font-size: 23px;

            box-shadow:
                0 12px 30px
                rgba(90,30,55,.16);
        }


        /* =========================================================
           TEXTO INFERIOR
        ========================================================= */

        .message {
            margin-top: 27px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-style: italic;

            font-size: 14px;

            color:
                rgba(66,34,45,.52);

            min-height: 22px;

            transition:
                opacity .5s ease;
        }


        /* =========================================================
           EXPLOSIÓN DE CORAZONES
        ========================================================= */

        .burst-heart {
            position: fixed;

            z-index: 30;

            pointer-events: none;

            font-size: 21px;

            animation:
                burstHeart
                1.5s
                ease-out
                forwards;
        }

        @keyframes burstHeart {

            0% {
                opacity: 1;

                transform:
                    translate3d(0,0,0)
                    scale(.4);
            }

            100% {
                opacity: 0;

                transform:
                    translate3d(
                        var(--x),
                        var(--y),
                        0
                    )
                    rotate(var(--rotate))
                    scale(1.25);
            }
        }


        /* =========================================================
           MENSAJES
        ========================================================= */

        .message-card {
            position: fixed;

            left: 50%;

            bottom:
                max(25px, env(safe-area-inset-bottom));

            transform:
                translate(-50%, 30px);

            z-index: 40;

            width:
                min(88vw, 350px);

            padding:
                13px 18px;

            border-radius: 18px;

            background:
                rgba(255,255,255,.75);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 15px 40px
                rgba(80,30,50,.12);

            text-align: center;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 14px;

            color: #542d3a;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .5s ease,
                transform .5s ease;
        }

        .message-card.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        /* =========================================================
           MÓVILES PEQUEÑOS
        ========================================================= */

        @media (max-height: 700px) {

            .cover-container {
                width:
                    min(64vw, 255px);

                margin-bottom: 20px;
            }

            .song-title {
                font-size: 25px;
            }

            .artist {
                margin-bottom: 17px;
            }

            .controls {
                margin-top: 15px;
            }

            .message {
                margin-top: 18px;
            }
        }

        .background-heart {
    position: absolute;

    color: rgba(255, 80, 130, 0.16);

    font-size: 130px;

    filter: blur(1px);

    pointer-events: none;

    user-select: none;

    animation:
        backgroundHeart
        7s
        ease-in-out
        infinite;
}


/* CORAZÓN 1 */

.heart-one {
    top: 5%;
    left: -35px;

    font-size: 140px;

    animation-delay: 0s;
}


/* CORAZÓN 2 */

.heart-two {
    top: 27%;
    right: -40px;

    font-size: 115px;

    animation-delay: 2s;
}


/* CORAZÓN 3 */

.heart-three {
    bottom: 12%;
    left: -30px;

    font-size: 100px;

    animation-delay: 4s;
}


/* CORAZÓN 4 */

.heart-four {
    bottom: 3%;
    right: 5%;

    font-size: 75px;

    animation-delay: 1s;
}


@keyframes backgroundHeart {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-8deg)
            scale(1);

        opacity: .35;
    }

    50% {
        transform:
            translateY(-20px)
            rotate(8deg)
            scale(1.1);

        opacity: .7;
    }
}

    </style>
</head>


<body>


    <!-- =========================================================
         FONDO
    ========================================================= -->

    <div class="background">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- CORAZONES GRANDES DE FONDO -->

    <div
        class="background-heart heart-one">
        ♥
    </div>

    <div
        class="background-heart heart-two">
        ♡
    </div>

    <div
        class="background-heart heart-three">
        ♥
    </div>

    <div
        class="background-heart heart-four">
        ♡
    </div>

</div>


    <div
        class="sparkles"
        id="sparkles">
    </div>


    <div
        id="floatingHearts">
    </div>


    <!-- =========================================================
         INTRO
    ========================================================= -->

    <section id="intro">

        <div class="intro-content">

            <div class="intro-heart">
                ❤️
            </div>

            <h1 class="intro-title">
                Para vos.
            </h1>

            <p class="intro-text">
                Hice algo que quería que
                <br>
                escucharas primero vos.
            </p>

            <button
                class="open-button"
                id="openButton">

                Abrir ♡

            </button>

        </div>

    </section>


    <!-- =========================================================
         APP
    ========================================================= -->

    <main class="app">

        <section
            class="player"
            id="player">


            <div class="note">
                ✦ hecho especialmente para vos
            </div>


            <!-- PORTADA -->

            <div class="cover-container">

                <img
                    src="portada.jpg"
                    alt="Portada del tema"
                    class="cover">

            </div>


            <!-- INFORMACIÓN -->

            <h2 class="song-title">
                Soltera
            </h2>

            <p class="artist">
                Fran
            </p>


            <!-- AUDIO -->

            <audio
                id="audio"
                preload="metadata">

                <source
                    src="soltera.mp3"
                    type="audio/mpeg">

            </audio>


            <!-- PROGRESO -->

            <input
                type="range"
                id="progress"
                class="progress"
                min="0"
                max="100"
                value="0"
                aria-label="Progreso de la canción">


            <div class="time">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


            <!-- CONTROLES -->

            <div class="controls">

                <button
                    class="control"
                    id="backButton"
                    aria-label="Retroceder 10 segundos">

                    ↶

                </button>


                <button
                    class="control play"
                    id="playButton"
                    aria-label="Reproducir">

                    ▶

                </button>


                <button
                    class="control"
                    id="forwardButton"
                    aria-label="Avanzar 10 segundos">

                    ↷

                </button>

            </div>


            <p
                class="message"
                id="message">

                Escuchalo hasta el final... ♡

            </p>


        </section>

    </main>


    <!-- MENSAJE FLOTANTE -->

    <div
        class="message-card"
        id="messageCard">

    </div>


    <script>


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const intro =
            document.getElementById("intro");

        const openButton =
            document.getElementById("openButton");

        const player =
            document.getElementById("player");

        const audio =
            document.getElementById("audio");

        const playButton =
            document.getElementById("playButton");

        const backButton =
            document.getElementById("backButton");

        const forwardButton =
            document.getElementById("forwardButton");

        const progress =
            document.getElementById("progress");

        const currentTime =
            document.getElementById("currentTime");

        const duration =
            document.getElementById("duration");

        const message =
            document.getElementById("message");

        const messageCard =
            document.getElementById("messageCard");

        const floatingHearts =
            document.getElementById("floatingHearts");

        const sparkles =
            document.getElementById("sparkles");


        /* =====================================================
           MENSAJES ROMÁNTICOS
        ===================================================== */

        const messages = [

            "♡ Espero que te guste.",

            "Hecho con un mucho amor.",

            "Ojalá puedas sentir lo mismo que sentí al hacerlo.",

            "Una canción para una persona especial. ❤️"

        ];

        let messageIndex = 0;


        /* =====================================================
           ABRIR
        ===================================================== */

        openButton.addEventListener(
            "click",
            async () => {

                intro.classList.add("hidden");

                player.classList.add("visible");

                createHeartBurst();

                /*
                 * Intentamos iniciar el audio.
                 *
                 * Como esta función se ejecuta
                 * después de un toque del usuario,
                 * los navegadores móviles
                 * normalmente permiten la reproducción.
                 */

                try {

                    await audio.play();

                    player.classList.add("playing");

                    playButton.textContent = "Ⅱ";

                }

                catch (error) {

                    console.log(
                        "El navegador requiere tocar Play."
                    );

                    playButton.textContent = "▶";

                }

                showMessage();

            }
        );


        /* =====================================================
           PLAY / PAUSE
        ===================================================== */

        playButton.addEventListener(
            "click",
            async () => {

                if (audio.paused) {

                    try {

                        await audio.play();

                        player.classList.add("playing");

                        playButton.textContent = "Ⅱ";

                        createHeartBurst();

                    }

                    catch (error) {

                        console.error(error);

                    }

                }

                else {

                    audio.pause();

                    player.classList.remove("playing");

                    playButton.textContent = "▶";

                }

            }
        );


        /* =====================================================
           METADATA
        ===================================================== */

        audio.addEventListener(
            "loadedmetadata",
            () => {

                duration.textContent =
                    formatTime(audio.duration);

            }
        );


        /* =====================================================
           PROGRESO
        ===================================================== */

        audio.addEventListener(
            "timeupdate",
            () => {

                if (!audio.duration)
                    return;

                const percent =
                    (audio.currentTime /
                     audio.duration) * 100;

                progress.value =
                    percent;

                currentTime.textContent =
                    formatTime(
                        audio.currentTime
                    );

            }
        );


        /* =====================================================
           CAMBIAR POSICIÓN
        ===================================================== */

        progress.addEventListener(
            "input",
            () => {

                if (!audio.duration)
                    return;

                audio.currentTime =
                    (progress.value / 100)
                    * audio.duration;

            }
        );


        /* =====================================================
           RETROCEDER
        ===================================================== */

        backButton.addEventListener(
            "click",
            () => {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 10
                    );

            }
        );


        /* =====================================================
           AVANZAR
        ===================================================== */

        forwardButton.addEventListener(
            "click",
            () => {

                audio.currentTime =
                    Math.min(
                        audio.duration || 0,
                        audio.currentTime + 10
                    );

            }
        );


        /* =====================================================
           CUANDO TERMINA
        ===================================================== */

        audio.addEventListener(
            "ended",
            () => {

                player.classList.remove("playing");

                playButton.textContent = "▶";

                progress.value = 0;

                createHeartBurst();

                setTimeout(
                    () => {

                        showMessage();

                    },
                    400
                );

            }
        );


        /* =====================================================
           FORMATEAR TIEMPO
        ===================================================== */

        function formatTime(seconds) {

            if (!Number.isFinite(seconds))
                return "0:00";

            const minutes =
                Math.floor(seconds / 60);

            const secondsPart =
                Math.floor(seconds % 60);

            return (
                minutes +
                ":" +
                secondsPart
                    .toString()
                    .padStart(2, "0")
            );

        }


        /* =====================================================
           CORAZONES FLOTANTES
        ===================================================== */

function createFloatingHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    const heartTypes = [
        "♡",
        "♥",
        "♡",
        "❤",
        "♡",
        "♥"
    ];

    heart.textContent =
        heartTypes[
            Math.floor(
                Math.random() * heartTypes.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "%";

    /*
     * Mucha más variedad de tamaños.
     */

    const size =
        12 + Math.random() * 24;

    heart.style.fontSize =
        size + "px";

    /*
     * Movimiento horizontal.
     */

    heart.style.setProperty(
        "--moveX",
        (Math.random() * 220 - 110) + "px"
    );

    heart.style.setProperty(
        "--rotation",
        (Math.random() * 80 - 40) + "deg"
    );

    /*
     * Velocidades diferentes.
     */

    const animationTime =
        7 + Math.random() * 9;

    heart.style.animationDuration =
        animationTime + "s";

    floatingHearts.appendChild(
        heart
    );

    setTimeout(
        () => {
            heart.remove();
        },
        animationTime * 1000
    );
    }   


        /*
         * Un corazón aproximadamente
         * cada 800ms.
         */

            setInterval(
                createFloatingHeart,
                350
            );


        /* =====================================================
           DESTELLOS
        ===================================================== */

        function createSparkle() {

            const sparkle =
                document.createElement("div");

            sparkle.className =
                "sparkle";

            sparkle.style.left =
                Math.random() * 100 + "%";

            sparkle.style.top =
                Math.random() * 100 + "%";

            sparkle.style.animationDelay =
                Math.random() * 3 + "s";

            sparkles.appendChild(
                sparkle
            );

        }


        for (
            let i = 0;
            i < 25;
            i++
        ) {

            createSparkle();

        }


        /* =====================================================
           EXPLOSIÓN DE CORAZONES
        ===================================================== */

        function createHeartBurst() {

            const amount = 20;

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const heart =
                    document.createElement("div");

                heart.className =
                    "burst-heart";

                heart.textContent =
                    Math.random() > .2
                        ? "❤️"
                        : "♡";

                heart.style.left =
                    "50%";

                heart.style.top =
                    "50%";

                heart.style.setProperty(
                    "--x",
                    (Math.random() * 280 - 140)
                    + "px"
                );

                heart.style.setProperty(
                    "--y",
                    (Math.random() * 320 - 160)
                    + "px"
                );

                heart.style.setProperty(
                    "--rotate",
                    (Math.random() * 80 - 40)
                    + "deg"
                );

                document.body.appendChild(
                    heart
                );

                setTimeout(
                    () => {

                        heart.remove();

                    },
                    1600
                );

            }

        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        function showMessage() {

            messageCard.textContent =
                messages[messageIndex];

            messageIndex =
                (messageIndex + 1)
                % messages.length;

            messageCard.classList.add(
                "show"
            );

            setTimeout(
                () => {

                    messageCard.classList.remove(
                        "show"
                    );

                },
                3200
            );

        }


        /*
         * Cada cierto tiempo aparece
         * otro pequeño mensaje.
         */

        setInterval(
            () => {

                if (
                    player.classList.contains(
                        "visible"
                    )
                ) {

                    showMessage();

                }

            },
            12000
        );


    </script>

</body>
