<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

    <meta name="theme-color" content="#f6c8d8">

    <title>Para vos ♡</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100svh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;

            color: #321e27;

            overflow-x: hidden;

            background:
                linear-gradient(
                    145deg,
                    #fff6f8 0%,
                    #f9dbe5 45%,
                    #efbdcf 100%
                );
        }


        /* =========================================================
           FONDO
        ========================================================= */

        .background {

            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(75px);

            opacity: .4;

            animation:
                glowMove
                11s
                ease-in-out
                infinite
                alternate;
        }

        .glow-1 {

            top: -140px;
            left: -120px;

            background: #ffffff;
        }

        .glow-2 {

            top: 35%;
            right: -150px;

            background: #ff91b4;

            animation-delay: 2s;
        }

        .glow-3 {

            bottom: -160px;
            left: 15%;

            background: #ffffff;

            animation-delay: 4s;
        }

        @keyframes glowMove {

            from {
                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            to {
                transform:
                    translate3d(35px,-25px,0)
                    scale(1.18);
            }
        }


        /* =========================================================
           CORAZONES GRANDES
        ========================================================= */

        .background-heart {

            position: absolute;

            color:
                rgba(255,70,125,.14);

            pointer-events: none;

            user-select: none;

            animation:
                backgroundHeart
                8s
                ease-in-out
                infinite;
        }

        .heart-one {

            top: 3%;
            left: -45px;

            font-size: 145px;
        }

        .heart-two {

            top: 30%;
            right: -45px;

            font-size: 120px;

            animation-delay: 2s;
        }

        .heart-three {

            bottom: 12%;
            left: -35px;

            font-size: 105px;

            animation-delay: 4s;
        }

        .heart-four {

            bottom: 2%;
            right: 8%;

            font-size: 80px;

            animation-delay: 1s;
        }

        @keyframes backgroundHeart {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-7deg)
                    scale(1);

                opacity: .3;
            }

            50% {

                transform:
                    translateY(-20px)
                    rotate(7deg)
                    scale(1.1);

                opacity: .65;
            }
        }


        /* =========================================================
           CORAZONES FLOTANTES
        ========================================================= */

        #floatingHearts {

            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 2;
        }

        .floating-heart {

            position: absolute;

            bottom: -50px;

            color:
                rgba(255,80,130,.55);

            text-shadow:
                0 0 10px
                rgba(255,100,150,.25);

            animation:
                floatHeart
                linear
                forwards;
        }

        @keyframes floatHeart {

            0% {

                opacity: 0;

                transform:
                    translate3d(0,0,0)
                    rotate(0deg)
                    scale(.6);
            }

            10% {

                opacity: .8;
            }

            50% {

                transform:
                    translate3d(
                        var(--moveX),
                        -55vh,
                        0
                    )
                    rotate(var(--rotation))
                    scale(1);
            }

            100% {

                opacity: 0;

                transform:
                    translate3d(
                        var(--moveX),
                        -115vh,
                        0
                    )
                    rotate(var(--rotation))
                    scale(1.25);
            }
        }


        /* =========================================================
           DESTELLOS
        ========================================================= */

        #sparkles {

            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 1;
        }

        .sparkle {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            animation:
                sparkle
                4s
                ease-in-out
                infinite;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(.5);
            }

            50% {
                opacity: .9;
                transform: scale(1.5);
            }
        }


        /* =========================================================
           INTRO
        ========================================================= */

        #intro {

            position: fixed;
            inset: 0;

            z-index: 100;

            display: flex;

            justify-content: center;
            align-items: center;

            padding:
                max(25px,env(safe-area-inset-top))
                25px
                max(25px,env(safe-area-inset-bottom));

            background:
                linear-gradient(
                    145deg,
                    #fff7f9,
                    #f6c9d9
                );

            transition:
                opacity .9s ease,
                visibility .9s ease;
        }

        #intro.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }

        .intro-content {

            width: 100%;

            max-width: 380px;

            text-align: center;

            animation:
                introAppear
                1.2s
                ease;
        }

        .intro-heart {

            font-size: 56px;

            margin-bottom: 24px;

            animation:
                heartbeat
                1.8s
                ease-in-out
                infinite;
        }

        .intro-title {

            font-family:
                Georgia,
                serif;

            font-weight: 400;

            font-size:
                clamp(40px,11vw,54px);

            color: #43232e;

            margin-bottom: 14px;
        }

        .intro-text {

            font-size: 15px;

            line-height: 1.8;

            color:
                rgba(67,35,46,.62);

            margin-bottom: 32px;
        }

        .open-button {

            border: 0;

            padding:
                16px 40px;

            border-radius: 999px;

            background: rgba(255,255,255,.9);

            color: #4c2835;

            font-size: 15px;

            font-weight: 600;

            box-shadow:
                0 12px 35px
                rgba(100,40,65,.16);

            cursor: pointer;

            transition:
                transform .2s ease;
        }

        .open-button:active {

            transform: scale(.93);
        }

        @keyframes introAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.13);
            }
        }


        /* =========================================================
           APP
        ========================================================= */

        .app {

            position: relative;

            z-index: 5;

            min-height: 100svh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding:
                max(25px,env(safe-area-inset-top))
                20px
                max(30px,env(safe-area-inset-bottom));
        }

        .player {

            width: 100%;

            max-width: 390px;

            opacity: 0;

            transform:
                translateY(25px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }

        .player.visible {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =========================================================
           GLASS CARD
        ========================================================= */

        .player-card {

            width: 100%;

            padding:
                18px 18px 20px;

            border-radius: 32px;

            background:
                rgba(255,255,255,.32);

            border:
                1px solid
                rgba(255,255,255,.45);

            backdrop-filter:
                blur(25px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(25px)
                saturate(150%);

            box-shadow:
                0 25px 70px
                rgba(100,35,60,.15);
        }


        /* =========================================================
           TOP BAR
        ========================================================= */

        .top-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                2px 4px 18px;
        }

        .top-label {

            font-size: 12px;

            font-weight: 600;

            color:
                rgba(65,32,44,.55);

            letter-spacing: .2px;
        }

        .top-heart {

            font-size: 18px;

            color:
                rgba(200,65,105,.7);

            animation:
                heartbeat
                2s
                ease-in-out
                infinite;
        }


        /* =========================================================
           PORTADA
        ========================================================= */

        .cover-wrapper {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            border-radius: 25px;

            overflow: visible;
        }

        .cover {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 25px;

            box-shadow:
                0 20px 50px
                rgba(70,25,45,.22);

            transition:
                transform .5s ease,
                box-shadow .5s ease;
        }

        .player.playing .cover {

            animation:
                coverPulse
                4s
                ease-in-out
                infinite;
        }

        @keyframes coverPulse {

            0%,
            100% {

                transform: scale(1);

                box-shadow:
                    0 20px 50px
                    rgba(70,25,45,.22);
            }

            50% {

                transform: scale(1.012);

                box-shadow:
                    0 25px 60px
                    rgba(70,25,45,.27);
            }
        }


        /* =========================================================
           INFORMACIÓN
        ========================================================= */

        .song-info {

            text-align: left;

            padding:
                22px 4px 8px;
        }

        .song-title {

            font-family:
                Georgia,
                serif;

            font-size:
                clamp(26px,7vw,32px);

            font-weight: 400;

            color: #3f222c;

            letter-spacing:
                -.5px;
        }

        .artist {

            margin-top: 5px;

            font-size: 14px;

            color:
                rgba(63,34,44,.52);
        }


        /* =========================================================
           BARRA DE PROGRESO ESTILO IOS
        ========================================================= */

        .progress-area {

            margin-top: 15px;
        }

        .progress {

            width: 100%;

            height: 4px;

            appearance: none;

            -webkit-appearance: none;

            border: none;

            outline: none;

            border-radius: 999px;

            background:
                rgba(65,30,45,.15);

            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {

            appearance: none;

            -webkit-appearance: none;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: #fff;

            box-shadow:
                0 1px 5px
                rgba(60,25,40,.25);
        }

        .progress::-moz-range-thumb {

            width: 13px;
            height: 13px;

            border: none;

            border-radius: 50%;

            background: white;
        }

        .time {

            display: flex;

            justify-content: space-between;

            margin-top: 7px;

            font-size: 10px;

            color:
                rgba(65,30,45,.42);
        }


        /* =========================================================
           CONTROLES
        ========================================================= */

        .controls {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 24px;

            margin-top: 15px;
        }

        .control {

            border: none;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,.35);

            color: #43232e;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform .15s ease;
        }

        .control:active {

            transform:
                scale(.86);
        }

        .play-button {

            width: 64px;
            height: 64px;

            background:
                rgba(255,255,255,.9);

            color: #3f222c;

            font-size: 22px;

            box-shadow:
                0 10px 25px
                rgba(80,25,50,.16);
        }


        /* =========================================================
           MENSAJE
        ========================================================= */

        .bottom-message {

            text-align: center;

            margin-top: 20px;

            font-family:
                Georgia,
                serif;

            font-style: italic;

            font-size: 13px;

            color:
                rgba(65,30,45,.5);
        }


        /* =========================================================
           HEART BURST
        ========================================================= */

        .burst-heart {

            position: fixed;

            z-index: 30;

            pointer-events: none;

            font-size: 20px;

            animation:
                burst
                1.5s
                ease-out
                forwards;
        }

        @keyframes burst {

            0% {

                opacity: 1;

                transform:
                    translate3d(0,0,0)
                    scale(.4);
            }

            100% {

                opacity: 0;

                transform:
                    translate3d(
                        var(--x),
                        var(--y),
                        0
                    )
                    rotate(var(--rotate))
                    scale(1.25);
            }
        }


        /* =========================================================
           MENSAJE FLOTANTE
        ========================================================= */

        .floating-message {

            position: fixed;

            z-index: 40;

            left: 50%;

            bottom:
                max(25px,env(safe-area-inset-bottom));

            width:
                min(88vw,350px);

            padding:
                13px 18px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.7);

            border:
                1px solid
                rgba(255,255,255,.5);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 15px 40px
                rgba(80,30,50,.12);

            text-align: center;

            font-family:
                Georgia,
                serif;

            font-size: 13px;

            color: #542d3a;

            opacity: 0;

            transform:
                translate(-50%,30px);

            pointer-events: none;

            transition:
                opacity .5s ease,
                transform .5s ease;
        }

        .floating-message.show {

            opacity: 1;

            transform:
                translate(-50%,0);
        }


        /* =========================================================
           CELULARES PEQUEÑOS
        ========================================================= */

        @media (max-height: 700px) {

            .player-card {

                padding:
                    14px 14px 16px;

                border-radius: 27px;
            }

            .cover {

                border-radius: 21px;
            }

            .song-info {

                padding-top: 16px;
            }

            .song-title {

                font-size: 24px;
            }

            .controls {

                margin-top: 10px;
            }

            .bottom-message {

                margin-top: 14px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         FONDO
    ========================================================= -->

    <div class="background">

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>


        <div class="background-heart heart-one">
            ♥
        </div>

        <div class="background-heart heart-two">
            ♡
        </div>

        <div class="background-heart heart-three">
            ♥
        </div>

        <div class="background-heart heart-four">
            ♡
        </div>

    </div>


    <div id="sparkles"></div>

    <div id="floatingHearts"></div>


    <!-- =========================================================
         INTRO
    ========================================================= -->

    <section id="intro">

        <div class="intro-content">

            <div class="intro-heart">
                ❤️
            </div>

            <h1 class="intro-title">
                Para vos.
            </h1>
            

            <p class="intro-text">

                de Fran
                <br>
                hecho con mucho amor

            </p>

            <button
                class="open-button"
                id="openButton">

                Abrir ♡

            </button>

        </div>

    </section>


    <!-- =========================================================
         APP
    ========================================================= -->

    <main class="app">

        <section
            class="player"
            id="player">


            <div class="player-card">


                <!-- TOP -->

                <div class="top-bar">

                    <span class="top-label">
                        HECHO PARA VOS
                    </span>

                    <span class="top-heart">
                        ♡
                    </span>

                </div>


                <!-- PORTADA -->

                <div class="cover-wrapper">

                    <img
                        src="portada.jpg"
                        class="cover"
                        alt="Portada">

                </div>


                <!-- INFORMACIÓN -->

                <div class="song-info">

                    <h2 class="song-title">
                        Soltera
                    </h2>

                    <p class="artist">
                        Fran
                    </p>

                </div>


                <!-- AUDIO -->

                <audio
                    id="audio"
                    preload="metadata">

                    <source
                        src="soltera.mp3"
                        type="audio/mpeg">

                </audio>


                <!-- PROGRESO -->

                <div class="progress-area">

                    <input
                        type="range"
                        id="progress"
                        class="progress"
                        min="0"
                        max="100"
                        value="0"
                        aria-label="Progreso">

                    <div class="time">

                        <span id="currentTime">
                            0:00
                        </span>

                        <span id="duration">
                            0:00
                        </span>

                    </div>

                </div>


                <!-- CONTROLES -->

                <div class="controls">


                    <button
                        class="control"
                        id="backButton"
                        aria-label="Retroceder">

                        ↶

                    </button>


                    <button
                        class="control play-button"
                        id="playButton"
                        aria-label="Reproducir">

                        ▶

                    </button>


                    <button
                        class="control"
                        id="forwardButton"
                        aria-label="Avanzar">

                        ↷

                    </button>


                </div>


                <p
                    class="bottom-message"
                    id="bottomMessage">

                    Te amo ♡

                </p>


            </div>

        </section>

    </main>


    <!-- MENSAJE -->

    <div
        class="floating-message"
        id="floatingMessage">

    </div>


    <script>


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const intro =
            document.getElementById("intro");

        const openButton =
            document.getElementById("openButton");

        const player =
            document.getElementById("player");

        const audio =
            document.getElementById("audio");

        const playButton =
            document.getElementById("playButton");

        const backButton =
            document.getElementById("backButton");

        const forwardButton =
            document.getElementById("forwardButton");

        const progress =
            document.getElementById("progress");

        const currentTime =
            document.getElementById("currentTime");

        const duration =
            document.getElementById("duration");

        const floatingHearts =
            document.getElementById("floatingHearts");

        const sparkles =
            document.getElementById("sparkles");

        const floatingMessage =
            document.getElementById("floatingMessage");


        /* =====================================================
           MENSAJES
        ===================================================== */

        const messages = [

            "♡ Espero que te guste.",

            "Hecho con un mucho amor.",

        ];

        let messageIndex = 0;


        /* =====================================================
           ABRIR
        ===================================================== */

        openButton.addEventListener(
            "click",
            async () => {

                intro.classList.add("hidden");

                player.classList.add("visible");

                heartBurst();


                /*
                 * Como el botón fue tocado por la persona,
                 * el navegador permite intentar reproducir
                 * el audio.
                 */

                try {

                    await audio.play();

                    player.classList.add("playing");

                    playButton.textContent = "Ⅱ";

                }

                catch {

                    playButton.textContent = "▶";

                }

                showMessage();

            }
        );


        /* =====================================================
           PLAY / PAUSE
        ===================================================== */

        playButton.addEventListener(
            "click",
            async () => {

                if (audio.paused) {

                    try {

                        await audio.play();

                        player.classList.add("playing");

                        playButton.textContent = "Ⅱ";

                        heartBurst();

                    }

                    catch (error) {

                        console.error(error);

                    }

                }

                else {

                    audio.pause();

                    player.classList.remove("playing");

                    playButton.textContent = "▶";

                }

            }
        );


        /* =====================================================
           METADATA
        ===================================================== */

        audio.addEventListener(
            "loadedmetadata",
            () => {

                duration.textContent =
                    formatTime(
                        audio.duration
                    );

            }
        );


        /* =====================================================
           TIEMPO
        ===================================================== */

        audio.addEventListener(
            "timeupdate",
            () => {

                if (!audio.duration)
                    return;

                progress.value =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;

                currentTime.textContent =
                    formatTime(
                        audio.currentTime
                    );

            }
        );


        /* =====================================================
           BARRA
        ===================================================== */

        progress.addEventListener(
            "input",
            () => {

                if (!audio.duration)
                    return;

                audio.currentTime =
                    (
                        progress.value /
                        100
                    ) * audio.duration;

            }
        );


        /* =====================================================
           ATRÁS
        ===================================================== */

        backButton.addEventListener(
            "click",
            () => {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 10
                    );

            }
        );


        /* =====================================================
           ADELANTE
        ===================================================== */

        forwardButton.addEventListener(
            "click",
            () => {

                audio.currentTime =
                    Math.min(
                        audio.duration || 0,
                        audio.currentTime + 10
                    );

            }
        );


        /* =====================================================
           FIN
        ===================================================== */

        audio.addEventListener(
            "ended",
            () => {

                player.classList.remove("playing");

                playButton.textContent = "▶";

                progress.value = 0;

                heartBurst();

                showMessage();

            }
        );


        /* =====================================================
           FORMATO TIEMPO
        ===================================================== */

        function formatTime(seconds) {

            if (!Number.isFinite(seconds))
                return "0:00";

            const minutes =
                Math.floor(
                    seconds / 60
                );

            const secs =
                Math.floor(
                    seconds % 60
                );

            return (
                minutes +
                ":" +
                secs
                    .toString()
                    .padStart(2,"0")
            );

        }


        /* =====================================================
           CORAZONES FLOTANTES
        ===================================================== */

        function createFloatingHeart() {

            const heart =
                document.createElement("div");

            heart.className =
                "floating-heart";

            const types = [
                "♡",
                "♥",
                "♡",
                "❤"
            ];

            heart.textContent =
                types[
                    Math.floor(
                        Math.random()
                        * types.length
                    )
                ];

            heart.style.left =
                Math.random() * 100 + "%";

            heart.style.fontSize =
                (
                    11 +
                    Math.random() * 23
                ) + "px";

            heart.style.setProperty(
                "--moveX",
                (
                    Math.random() * 220 -
                    110
                ) + "px"
            );

            heart.style.setProperty(
                "--rotation",
                (
                    Math.random() * 80 -
                    40
                ) + "deg"
            );

            const time =
                7 +
                Math.random() * 8;

            heart.style.animationDuration =
                time + "s";

            floatingHearts.appendChild(
                heart
            );

            setTimeout(
                () => heart.remove(),
                time * 1000
            );

        }


        setInterval(
            createFloatingHeart,
            400
        );


        /* =====================================================
           DESTELLOS
        ===================================================== */

        for (
            let i = 0;
            i < 30;
            i++
        ) {

            const sparkle =
                document.createElement("div");

            sparkle.className =
                "sparkle";

            sparkle.style.left =
                Math.random() * 100 + "%";

            sparkle.style.top =
                Math.random() * 100 + "%";

            sparkle.style.animationDelay =
                Math.random() * 4 + "s";

            sparkles.appendChild(
                sparkle
            );

        }


        /* =====================================================
           EXPLOSIÓN DE CORAZONES
        ===================================================== */

        function heartBurst() {

            for (
                let i = 0;
                i < 22;
                i++
            ) {

                const heart =
                    document.createElement("div");

                heart.className =
                    "burst-heart";

                heart.textContent =
                    Math.random() > .2
                        ? "❤️"
                        : "♡";

                heart.style.left =
                    "50%";

                heart.style.top =
                    "50%";

                heart.style.setProperty(
                    "--x",
                    (
                        Math.random() * 300 -
                        150
                    ) + "px"
                );

                heart.style.setProperty(
                    "--y",
                    (
                        Math.random() * 340 -
                        170
                    ) + "px"
                );

                heart.style.setProperty(
                    "--rotate",
                    (
                        Math.random() * 80 -
                        40
                    ) + "deg"
                );

                document.body.appendChild(
                    heart
                );

                setTimeout(
                    () => heart.remove(),
                    1600
                );

            }

        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        function showMessage() {

            floatingMessage.textContent =
                messages[messageIndex];

            messageIndex =
                (
                    messageIndex + 1
                ) % messages.length;

            floatingMessage.classList.add(
                "show"
            );

            setTimeout(
                () => {

                    floatingMessage.classList.remove(
                        "show"
                    );

                },
                3200
            );

        }


        /*
         * Un mensaje nuevo cada 14 segundos.
         */

        setInterval(
            () => {

                if (
                    player.classList.contains(
                        "visible"
                    )
                ) {

                    showMessage();

                }

            },
            14000
        );


    </script>

</body>
</html>
